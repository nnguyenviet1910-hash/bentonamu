const KEY='nihongo-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}state={done:[],wrong:[],stars:[],history:[],notes:{},...state};let tab='grammar',session=null,flash=null;const allV=LESSONS.flatMap(l=>l.vocab),allK=LESSONS.flatMap(l=>l.kanji);let savedQuiz;try{savedQuiz=JSON.parse(localStorage.getItem(KEY+'-quiz'))}catch{};

function head(title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">毎日 · NIHONGO NOTEBOOK</div><h1>${title}</h1><div class="muted mini">${sub}</div></div>${action}</div>`}

function lessons(){ $('#app').innerHTML=head('Lộ trình 41 buổi học','Theo thứ tự từng phần A, B, C, D trong 14 chương tài liệu.')+`<div class="filters"><input id="lessonSearch" placeholder="Tìm tên bài hoặc mẫu ngữ pháp…" aria-label="Tìm bài học"><select id="chapterFilter" aria-label="Lọc chương"><option value="">Tất cả chương</option>${Array.from({length:14},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div><div class="grid" id="lessonGrid"></div>`;$('#lessonSearch').oninput=filterLessons;$('#chapterFilter').onchange=filterLessons;filterLessons()}
function filterLessons(){const q=$('#lessonSearch').value.toLowerCase(),c=$('#chapterFilter').value;const ls=LESSONS.filter(l=>(!c||l.chapter==c)&&JSON.stringify(l.grammar).concat(l.title).toLowerCase().includes(q));$('#lessonGrid').innerHTML=ls.length?ls.map(l=>`<a class="card lesson-card" href="#lesson/${l.id}"><div class="section-head"><span class="eyebrow">BUỔI ${String(l.id).padStart(2,'0')}</span><span class="badge">${state.done.includes(l.id)?'✓ Hoàn thành':`Chương ${l.chapter}${l.part}`}</span></div><h3>${l.title}</h3><p>${l.grammar.map(g=>esc(g.pattern)).join(' · ')}</p><div class="line"></div><div class="section-head" style="margin:0"><small class="muted">Ôn tích lũy buổi 1–${l.id}</small><span>→</span></div></a>`).join(''):`<div class="empty">Không tìm thấy bài học phù hợp.</div>`}
function lesson(id){let l=LESSONS[id-1];if(!l){location.hash='lessons';return}$('#app').innerHTML=head(l.title,`Buổi ${l.id} / 41 · Chương ${l.chapter} — phần ${l.part}`,`<a class="btn light" href="#lessons">← Lộ trình</a>`)+`<div class="callout">Buổi này học phần ${l.chapter}${l.part}. Bài ôn tích lũy bao gồm <strong>tất cả buổi 1–${id}</strong>. Chữ Hán cuối chương được chia đều vào các buổi trong chương để học dần.</div><div class="tabs">${[['grammar','Ngữ pháp'],['vocab','Từ vựng'],['kanji','Chữ Hán'],['notes','Ghi chú']].map(([v,n])=>`<button class="${tab===v?'active':''}" onclick="tab='${v}';lesson(${id})">${n}</button>`).join('')}</div><div id="lessonContent"></div><div class="actions"><button class="btn" onclick="location.hash='review/${id}'">Làm bài ôn tích lũy →</button><button class="btn light" onclick="markDone(${id})">${state.done.includes(id)?'✓ Đã học — bỏ đánh dấu':'Đánh dấu đã học'}</button></div><div class="source">Đề ôn do ứng dụng biên soạn theo chủ điểm, không phải đáp án chính thức của sách. Từ vựng hiện là bộ trọng tâm có bổ sung ví dụ; chưa số hóa toàn bộ bài tập gốc.</div><a class="source" href="https://chatgpt.com/library?file_id=${l.source}&account_id=personal" target="_blank" rel="noopener">Mở tài liệu gốc chương ${l.chapter} ↗</a><div class="actions">${id>1?`<a class="btn light" href="#lesson/${id-1}">← Buổi trước</a>`:''}${id<41?`<a class="btn light" href="#lesson/${id+1}">Buổi tiếp theo →</a>`:''}</div>`;
if(tab==='grammar')$('#lessonContent').innerHTML=l.grammar.map((g,j)=>`<article class="card grammar"><span class="eyebrow">MẪU CÂU ${j+1}</span><div class="jp">${esc(g.pattern)}</div><p>${esc(g.meaning)}</p></article>`).join('')+`<div class="card"><h3>Ví dụ luyện tập của buổi</h3><div class="example jp">${esc(l.question.explain)}<small>${esc(l.question.translation)}</small></div></div>`;
if(tab==='vocab')$('#lessonContent').innerHTML=`<div class="section-head"><span class="note">Chữ Nhật · kana · romaji · nghĩa tiếng Việt</span><a href="#flash/${id}" class="textlink">Flashcard →</a></div><div class="card">${l.vocab.map(vocabRow).join('')}</div>`;
if(tab==='kanji')$('#lessonContent').innerHTML=`<p class="note">Nghĩa nhận diện cơ bản. Cách đọc chữ Hán được luyện theo từ ghép trong phần từ vựng.</p><div class="grid">${l.kanji.map(k=>`<div class="card"><div class="jp" style="font-size:42px">${k.word}</div><p>${k.meaning}</p></div>`).join('')}</div>`;
if(tab==='notes'){$('#lessonContent').innerHTML=`<label for="notes">Ghi chú riêng cho buổi ${id}</label><textarea id="notes" placeholder="Ghi lại chỗ dễ nhầm, ví dụ của bạn…">${esc(state.notes[id]||'')}</textarea><p class="note">Tự lưu trên trình duyệt này.</p>`;$('#notes').oninput=e=>{state.notes[id]=e.target.value;save()}}}
function markDone(id){state.done=state.done.includes(id)?state.done.filter(n=>n!==id):[...state.done,id];save();lesson(id)}
function vocabRow(v){return `<div class="vocab"><div><div class="jp">${esc(v.word)}</div><small>${esc(v.kana)} · ${esc(v.romaji)}</small><small>${esc(v.meaning)} <span class="muted">· Buổi ${v.lesson}</span></small></div><button class="star" aria-label="${state.stars.includes(v.id)?'Bỏ lưu':'Lưu từ'}" onclick="star('${v.id}',this)">${state.stars.includes(v.id)?'★':'☆'}</button></div>`}
function star(id,el){state.stars=state.stars.includes(id)?state.stars.filter(x=>x!==id):[...state.stars,id];save();el.textContent=state.stars.includes(id)?'★':'☆';el.setAttribute('aria-label',state.stars.includes(id)?'Bỏ lưu':'Lưu từ')}
function vocab(){ $('#app').innerHTML=head('Sổ tay từ vựng','164 mục từ trọng tâm · chữ Nhật, kana, romaji và nghĩa tiếng Việt.')+`<div class="filters"><input id="vocabSearch" placeholder="Tìm bằng tiếng Việt, chữ Nhật hoặc romaji…" aria-label="Tìm từ vựng"><select id="vocabScope" aria-label="Phạm vi từ vựng"><option value="all">Tất cả từ vựng</option><option value="star">Từ đã lưu</option>${LESSONS.map(l=>`<option value="${l.id}">Buổi ${l.id} · ${l.chapter}${l.part}</option>`).join('')}</select></div><div class="card" id="vocabList"></div>`;$('#vocabSearch').oninput=filterVocab;$('#vocabScope').onchange=filterVocab;filterVocab()}
function filterVocab(){let q=$('#vocabSearch').value.toLowerCase(),scope=$('#vocabScope').value;let vs=allV.filter(v=>(scope==='all'||scope==='star'&&state.stars.includes(v.id)||v.lesson==scope)&&[v.word,v.kana,v.romaji,v.meaning].join(' ').toLowerCase().includes(q));$('#vocabList').innerHTML=vs.length?vs.map(vocabRow).join(''):`<div class="empty">Chưa có từ phù hợp.</div>`}
function makeOptions(answer,values){const pool=[...new Set(values)].filter(x=>x!==answer);return shuffle([answer,...shuffle(pool).slice(0,3)])}
function bank(max){const vs=allV.filter(v=>v.lesson<=max),ks=allK.filter(k=>k.lesson<=max),questions=[];for(const v of vs){const variants=[['kana',`Cách đọc kana của 「${v.word}」 là gì?`],['romaji',`Romaji của 「${v.word}」 là gì?`],['meaning',`「${v.word}」 nghĩa là gì?`],['word',`Chọn chữ Nhật cho cách đọc 「${v.kana}」 (${v.meaning}).`]];for(const [field,prompt] of variants){let opts=makeOptions(v[field],allV.map(x=>x[field]));questions.push({id:v.id+'-'+field,lesson:v.lesson,type:'vocab',prompt,answer:v[field],options:opts,vocab:v,explain:`${v.word} → ${v.kana} → ${v.romaji} → ${v.meaning}`})}}
for(const k of ks){questions.push({id:k.id+'-meaning',lesson:k.lesson,type:'kanji',prompt:`Chữ Hán 「${k.word}」 có nghĩa cơ bản nào?`,answer:k.meaning,options:makeOptions(k.meaning,allK.map(x=>x.meaning)),explain:`${k.word}: ${k.meaning}. Hãy ghi nhớ cách đọc trong từ cụ thể, vì một chữ Hán có thể có nhiều cách đọc.`});questions.push({id:k.id+'-word',lesson:k.lesson,type:'kanji',prompt:`Chọn chữ Hán mang nghĩa: ${k.meaning}.`,answer:k.word,options:makeOptions(k.word,allK.map(x=>x.word)),explain:`Chữ ${k.word} mang nghĩa cơ bản: ${k.meaning}.`})}questions.push(...LESSONS.filter(l=>l.id<=max).map(l=>({...l.question})));return questions}
function review(id){id=Number(id)||nextLesson().id;let count=bank(id).length;$('#app').innerHTML=head('Ôn lại để nhớ lâu hơn','Trắc nghiệm 4 đáp án · Xáo trộn câu hỏi và đáp án mỗi lượt.')+`<div class="cols"><div class="card"><span class="eyebrow">THIẾT LẬP BUỔI ÔN</span><h2 style="margin:15px 0">Hôm nay bạn học đến đâu?</h2><select id="reviewMax" style="width:100%" aria-label="Ôn đến buổi">${LESSONS.map(l=>`<option value="${l.id}" ${l.id===id?'selected':''}>Buổi ${l.id} · ${l.chapter}${l.part} — ${l.title}</option>`).join('')}</select><div class="callout">Phạm vi: <strong>buổi 1–${id}</strong><br>Ngân hàng: ${count} câu, gồm từ vựng, ngữ pháp và chữ Hán.</div><label for="reviewMode">Chọn cách ôn</label><select id="reviewMode" style="width:100%;margin:12px 0"><option value="full">Ôn đầy đủ — ${count} câu trong phạm vi</option><option value="quick">Ôn nhanh — mỗi buổi 1 câu mỗi dạng</option><option value="today">Chỉ kiến thức mới của buổi ${id}</option></select><p class="note">Ôn đầy đủ bao gồm mọi câu trong ngân hàng từ buổi 1 đến buổi chọn. Ôn nhanh chỉ lấy mẫu đại diện, không thay thế lượt đầy đủ.</p><button class="btn" style="width:100%" onclick="startQuiz(${id},$('#reviewMode').value)">Bắt đầu lượt ôn →</button>${savedQuiz&&savedQuiz.index<savedQuiz.questions.length?`<button class="btn light" style="width:100%;margin-top:10px" onclick="resumeQuiz()">Tiếp tục lượt đang làm (${savedQuiz.index+1}/${savedQuiz.questions.length})</button>`:''}</div><div><div class="card review-card"><span class="eyebrow">NHỚ ĐỦ MỌI DẠNG</span><h2 style="margin:22px 0;line-height:1.7">学生 → がくせい<br>gakusei → sinh viên</h2><p>Từ vựng đổi hướng hỏi giữa cách viết, cách đọc kana, romaji và nghĩa. Từ vay mượn giữ katakana chuẩn.</p><div class="line"></div><p>Ngữ pháp có ví dụ và bản dịch sau mỗi câu. Làm lại bài để đảo thứ tự câu hỏi và vị trí đáp án.</p><a href="#mistakes" class="textlink">Luyện ${state.wrong.length} câu còn nhầm →</a></div></div></div>`;$('#reviewMax').onchange=e=>{location.hash='review/'+e.target.value}}
function startQuiz(max,mode='full'){let pool=bank(max);if(mode==='today')pool=pool.filter(q=>q.lesson===max);if(mode==='wrong')pool=pool.filter(q=>state.wrong.includes(q.id));if(mode==='quick')pool=LESSONS.filter(l=>l.id<=max).flatMap(l=>['vocab','grammar','kanji'].flatMap(t=>shuffle(pool.filter(q=>q.lesson===l.id&&q.type===t)).slice(0,1)));if(!pool.length){toast('Chưa có câu cần luyện trong phạm vi này.');return}session={max,mode,index:0,score:0,questions:shuffle(pool).map(q=>({...q,options:shuffle(q.options)})),answers:[],started:Date.now()};saveQuiz();location.hash='quiz';quiz()}
function resumeQuiz(){session=savedQuiz;location.hash='quiz';quiz()}
function quiz(){if(!session){if(savedQuiz){session=savedQuiz}else{location.hash='review';return}}if(session.index>=session.questions.length){results();return}let q=session.questions[session.index],a=session.answers[session.index];$('#app').innerHTML=`<div class="quiz-wrap">${head('Một câu nữa, nhớ thêm một chút.',`Câu ${session.index+1} / ${session.questions.length} · Phạm vi buổi 1–${session.max}`,`<a class="btn light" href="#review/${session.max}">Tạm nghỉ</a>`)}<div class="progress"><i style="width:${session.index/session.questions.length*100}%"></i></div><div class="section-head" style="margin-top:24px"><span class="badge">${{vocab:'Từ vựng',grammar:'Ngữ pháp',kanji:'Chữ Hán'}[q.type]}</span><span class="mini muted">Nguồn kiến thức: buổi ${q.lesson} · ${LESSONS[q.lesson-1].chapter}${LESSONS[q.lesson-1].part}</span></div><div class="quiz-question jp">${esc(q.prompt)}</div><div class="answers">${q.options.map((o,i)=>`<button class="answer ${a?(o===q.answer?'right':o===a.choice?'wrong':''):''}" ${a?'disabled':''} onclick="answer(${i})"><span class="muted">${'ABCD'[i]}.</span> ${esc(o)}</button>`).join('')}</div>${a?`<div class="feedback ${a.correct?'':'bad'}" role="status"><strong>${a.correct?'✓ Chính xác!':'Chưa đúng — cùng ghi nhớ lại nhé.'}</strong><p>Đáp án: <strong>${esc(q.answer)}</strong></p><div>${esc(q.explain)}</div>${q.translation?`<div class="example">${esc(q.translation)}</div>`:''}${q.vocab?`<div class="example"><span class="jp">${esc(q.vocab.word)} · ${esc(q.vocab.kana)}</span><small>Romaji: ${esc(q.vocab.romaji)}<br>Nghĩa: ${esc(q.vocab.meaning)}</small></div>`:''}<a class="source" href="#lesson/${q.lesson}">Xem kiến thức buổi ${q.lesson} →</a></div><button class="btn" style="width:100%;margin-top:18px" onclick="advance()">${session.index+1===session.questions.length?'Xem kết quả':'Câu tiếp theo →'}</button>`:`<p class="note">Chọn một đáp án để xem giải thích. Tiến độ được tự lưu.</p>`}</div>`}
function answer(i){if(session.answers[session.index])return;let q=session.questions[session.index],choice=q.options[i],correct=choice===q.answer;session.answers[session.index]={choice,correct};if(correct){session.score++;state.wrong=state.wrong.filter(id=>id!==q.id)}else if(!state.wrong.includes(q.id))state.wrong.push(q.id);save();saveQuiz();quiz()}
function advance(){if(!session.answers[session.index])return;session.index++;saveQuiz();quiz();window.scrollTo(0,0)}
function results(){if(!session.recorded){state.history.unshift({time:Date.now(),max:session.max,mode:session.mode,score:session.score,total:session.questions.length});state.history=state.history.slice(0,100);session.recorded=true;save();saveQuiz()}let pct=Math.round(session.score/session.questions.length*100);$('#app').innerHTML=`<div class="flash-wrap">${head('Đã hoàn thành lượt ôn!',`Buổi 1–${session.max} · ${session.questions.length} câu hỏi`)}<div class="card"><div class="eyebrow">MỖI LẦN ÔN LÀ MỘT LẦN TIẾN BỘ</div><div class="result">${pct}%</div><p>Đúng <strong>${session.score}</strong> / ${session.questions.length} câu</p><p class="muted">${pct>=80?'Rất tốt! Bạn có thể tiếp tục hoặc làm lại để củng cố.':'Xem lại các câu còn nhầm rồi thử một lượt nữa nhé.'}</p><div class="actions"><button class="btn" onclick="startQuiz(${session.max},'${session.mode}')">↻ Làm lại — xáo trộn</button><button class="btn light" onclick="startQuiz(${session.max},'wrong')">Luyện câu sai</button></div><a class="textlink" href="#lesson/${Math.min(41,session.max+1)}">Đến bài học tiếp theo →</a></div></div>`}
function mistakes(){let qs=bank(41).filter(q=>state.wrong.includes(q.id));$('#app').innerHTML=head('Những câu cần gặp lại',`${qs.length} câu chưa trả lời đúng gần nhất. Trả lời đúng khi luyện lại sẽ tự xóa khỏi danh sách.`,qs.length?`<button class="btn" onclick="startQuiz(41,'wrong')">Luyện lại tất cả →</button>`:'')+(qs.length?qs.map(q=>`<div class="card grammar"><span class="badge">Buổi ${q.lesson} · ${{vocab:'Từ vựng',grammar:'Ngữ pháp',kanji:'Chữ Hán'}[q.type]}</span><p class="jp">${esc(q.prompt)}</p><details><summary>Xem đáp án và giải thích</summary><strong>${esc(q.answer)}</strong><p>${esc(q.explain)}</p>${q.translation?`<p>${esc(q.translation)}</p>`:''}</details></div>`).join(''):`<div class="card empty">✧<br>Chưa có câu nào cần luyện lại.<br>Các câu trả lời sai sẽ xuất hiện tại đây.<br><a class="btn" style="margin-top:20px" href="#review">Bắt đầu ôn tập</a></div>`)}
function flashcard(id,reset=false){if(!flash||flash.id!==id||reset)flash={id,words:shuffle(allV.filter(v=>v.lesson<=id)),index:0,flipped:false};const v=flash.words[flash.index];$('#app').innerHTML=`<div class="flash-wrap">${head('Thẻ ghi nhớ',`Từ vựng tích lũy buổi 1–${id} · ${flash.index+1}/${flash.words.length}`)}<button class="flashcard" onclick="flash.flipped=!flash.flipped;flashcard(${id})"><span class="eyebrow">${flash.flipped?'ĐỐI CHIẾU ĐỦ BỐN DẠNG':'CHẠM ĐỂ LẬT THẺ'}</span><div class="jp" style="margin-top:30px">${v.word}</div>${flash.flipped?`<p>${v.kana}</p><span>${v.romaji}</span><p>${v.meaning}</p>`:''}</button><div class="actions"><button class="btn light" onclick="flash.index=(flash.index-1+flash.words.length)%flash.words.length;flash.flipped=false;flashcard(${id})">← Trước</button><button class="btn" onclick="flash.index=(flash.index+1)%flash.words.length;flash.flipped=false;flashcard(${id})">Tiếp →</button></div><button class="textlink" onclick="flashcard(${id},true)">↻ Xáo trộn bộ thẻ</button></div>`}
function settings(){const hist=state.history.slice(0,12);$('#app').innerHTML=head('Dữ liệu học tập','Tiến độ lưu trên trình duyệt và thiết bị đang dùng; chưa có đồng bộ tài khoản.')+`<div class="settings-grid"><div class="card"><h3>Sao lưu & chuyển thiết bị</h3><p class="muted mini">Xuất bản sao rồi nhập trên điện thoại để mang theo tiến độ, câu sai, từ đã lưu và ghi chú.</p><div class="actions"><button class="btn" onclick="exportData()">Xuất bản sao</button><label class="btn light" for="importFile">Nhập bản sao</label><input type="file" id="importFile" accept="application/json" hidden></div><p class="note" id="importStatus"></p></div><div class="card"><h3>Nội dung hiện có</h3><p class="mini muted">41 buổi · 148 điểm ngữ pháp · 164 mục từ trọng tâm · 161 chữ Hán.<br>Ngân hàng có ${bank(41).length} câu, trong đó 41 câu ngữ pháp minh họa. Bài ôn biên soạn mới theo chủ điểm của tài liệu; chưa thay thế toàn bộ bài tập gốc.</p><p class="note">Không có audio gốc trong bản này. Romaji dùng cách viết ou/uu cho nguyên âm dài; từ vay mượn hiển thị katakana chuẩn.</p></div></div><h2 style="margin:28px 0 16px">Lịch sử ôn tập</h2>${hist.length?hist.map(h=>`<div class="lesson-row"><span class="lesson-num">${Math.round(h.score/h.total*100)}%</span><div class="grow"><h3>Ôn đến buổi ${h.max} · ${{full:'Đầy đủ',quick:'Ôn nhanh',today:'Bài mới',wrong:'Câu sai'}[h.mode]}</h3><small>${new Date(h.time).toLocaleString('vi-VN')} · ${h.score}/${h.total} câu đúng</small></div></div>`).join(''):`<div class="card empty">Lịch sử sẽ xuất hiện khi bạn hoàn thành lượt ôn đầu tiên.</div>`}`;$('#importFile').onchange=importData}
function exportData(){const blob=new Blob([JSON.stringify({version:1,state,quiz:savedQuiz},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='nihongo-tien-do.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importData(e){try{let f=e.target.files[0];if(!f)return;if(f.size>10000000)throw Error('Tệp quá lớn');let d=JSON.parse(await f.text());if(d.version!==1||!d.state||!Array.isArray(d.state.done)||!Array.isArray(d.state.wrong)||!Array.isArray(d.state.stars)||!Array.isArray(d.state.history)||typeof d.state.notes!=='object'||d.state.notes===null)throw Error('Sai định dạng');const validIds=new Set(bank(41).map(q=>q.id));let clean={done:d.state.done.filter(x=>Number.isInteger(x)&&x>=1&&x<=41),wrong:d.state.wrong.filter(x=>validIds.has(x)),stars:d.state.stars.filter(x=>allV.some(v=>v.id===x)),history:d.state.history.filter(h=>h&&Number.isFinite(h.time)&&h.max>=1&&h.max<=41&&h.total>0&&h.score>=0&&h.score<=h.total&&['full','quick','today','wrong'].includes(h.mode)).slice(0,100),notes:Object.fromEntries(Object.entries(d.state.notes).filter(([k,v])=>+k>=1&&+k<=41&&typeof v==='string').map(([k,v])=>[k,v.slice(0,20000)]))};if(!confirm('Nhập bản sao sẽ thay thế tiến độ đang lưu trên thiết bị này. Tiếp tục?'))return;state=clean;session=null;savedQuiz=null;localStorage.removeItem(KEY+'-quiz');save();settings();toast('Đã nhập tiến độ. Lượt đang làm dở không được nhập.')}catch{$('#importStatus').textContent='Không thể nhập: hãy chọn tệp bản sao hợp lệ do ứng dụng xuất.'}}
function route(){nav();const [r,raw]=location.hash.slice(1).split('/'),id=Math.max(1,Math.min(41,parseInt(raw)||nextLesson().id));if(r==='lesson')lesson(id);else if(r==='lessons')lessons();else if(r==='vocab')vocab();else if(r==='review')review(id);else if(r==='quiz')quiz();else if(r==='mistakes')mistakes();else if(r==='flash')flashcard(id);else if(r==='settings')settings();else home();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
</script></body></html>
